      - paragraph [ref=f4e75]:
        - text: Innerlaget sitter mot huden og avgjør om svetten blir værende eller blir transportert ut. Ull og syntetisk fiber gjør den jobben på ulike måter; bomull gjør den dårlig
        - superscript [ref=f4e76]:
          - text: "["
          - link "6" [ref=f4e78] [cursor=pointer]:
            - /url: "#kilde-6"
          - generic [ref=f4e79]:
            - text: ","
            - link "7" [ref=f4e80] [cursor=pointer]:
              - /url: "#kilde-7"
          - text: "]"
        - text: . Denne artikkelen går gjennom hva innerlaget skal gjøre, hvordan materialene oppfører seg i kulde, og hva du velger etter aktivitet.
      - heading "Kort svar først" [level=2] [ref=f4e81]
      - paragraph [ref=f4e82]:
        - text: Det beste innerlaget avhenger av aktivitet, svette, temperatur og hva du har utenpå
        - superscript [ref=f4e83]:
          - text: "["
          - link "6" [ref=f4e85] [cursor=pointer]:
            - /url: "#kilde-6"
          - generic [ref=f4e86]:
            - text: ","
            - link "7" [ref=f4e87] [cursor=pointer]:
              - /url: "#kilde-7"
          - text: "]"
        - text: . Ull og tekniske syntetiske materialer fungerer begge, men de håndterer fukt og tørketid forskjellig
        - superscript [ref=f4e88]:
          - text: "["
          - link "6" [ref=f4e90] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Ull isolerer også når det blir fuktig; syntetiske fibre tørker raskere på kroppen og puster bedre ved høy puls
        - superscript [ref=f4e91]:
          - text: "["
          - link "2" [ref=f4e93] [cursor=pointer]:
            - /url: "#kilde-2"
          - generic [ref=f4e94]:
            - text: ","
            - link "6" [ref=f4e95] [cursor=pointer]:
              - /url: "#kilde-6"
          - text: "]"
        - text: . Skal du sitte stille lenge, er ull det tryggere valget. Ved høy aktivitet og mye svette – særlig hvis du kan skifte etterpå – er syntetisk materiale eller en ull-hybrid et godt valg
        - superscript [ref=f4e96]:
          - text: "["
          - link "2" [ref=f4e98] [cursor=pointer]:
            - /url: "#kilde-2"
          - text: "]"
        - text: . Bomull bør unngås
        - superscript [ref=f4e99]:
          - text: "["
          - link "6" [ref=f4e101] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: .
      - heading "Hva skal innerlaget egentlig gjøre?" [level=2] [ref=f4e102]
      - paragraph [ref=f4e103]:
        - text: Innerlaget, plagget nærmest huden, skal holde huden tørr og forbedre den termiske opplevelsen når aktivitet og vær skifter
        - superscript [ref=f4e104]:
          - text: "["
          - link "6" [ref=f4e106] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Det møter kroppsvarme og utveksling av vanndamp og svette med én gang
        - superscript [ref=f4e107]:
          - text: "["
          - link "6" [ref=f4e109] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Som beskrevet i
        - link "Hvorfor blir man kald" [ref=f4e110] [cursor=pointer]:
          - /url: /kunnskap/hvorfor-blir-man-kald
        - text: ", taper kroppen varme til omgivelsene, og konveksjon kombinert med fukt dominerer tapet"
        - superscript [ref=f4e111]:
          - text: "["
          - link "8" [ref=f4e113] [cursor=pointer]:
            - /url: "#kilde-8"
          - text: "]"
        - text: .
      - paragraph [ref=f4e114]:
        - text: I full hvile avgir en voksen person rundt 30 gram fukt i timen
        - superscript [ref=f4e115]:
          - text: "["
          - link "6" [ref=f4e117] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Ved høy aktivitet i kulde kan utskillelsen over tid komme opp mot én liter i timen
        - superscript [ref=f4e118]:
          - text: "["
          - link "6" [ref=f4e120] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: ". Innerlaget må plukke opp svetten og transportere den ut til neste lag, slik at du ikke kjøles ned under eller rett etter aktiviteten. Laget skal også fange luft: den stillestående luften mellom fibrene står for mye av isolasjonen"
        - superscript [ref=f4e121]:
          - text: "["
          - link "6" [ref=f4e123] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: .
      - heading "Ull som innerlag" [level=2] [ref=f4e124]
      - paragraph [ref=f4e125]:
        - text: "Ullfibrene er hydrofile (vannelskende): de kan ta opp mye fukt fra kroppen mens tekstilet likevel føles tørt mot huden"
        - superscript [ref=f4e126]:
          - text: "["
          - link "6" [ref=f4e128] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Når ulla absorberer fukt, frigjøres varme i en eksoterm reaksjon – målt til omtrent 2,5 ganger mer enn fra syntetisk polyamid
        - superscript [ref=f4e129]:
          - text: "["
          - link "6" [ref=f4e131] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: .
      - paragraph [ref=f4e132]:
        - text: Det er en av grunnene til at ull beholder en stor del av isolasjonen etter at det har blitt fuktig
        - superscript [ref=f4e133]:
          - text: "["
          - link "2" [ref=f4e135] [cursor=pointer]:
            - /url: "#kilde-2"
          - text: "]"
        - text: . Fiberen er kruset og fleksibel og holder stillestående luft i fiberen, i garnet og i stoffet
        - superscript [ref=f4e136]:
          - text: "["
          - link "6" [ref=f4e138] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Det bremser temperaturfallet i pauser – ofte kalt etter-nedkjøling – når muskelarbeidet stanser
        - superscript [ref=f4e139]:
          - text: "["
          - link "6" [ref=f4e141] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: .
      - paragraph [ref=f4e142]:
        - text: "Ulempen er tørketid: ull bruker lenger tid på å tørke enn mange lette syntetiske alternativer"
        - superscript [ref=f4e143]:
          - text: "["
          - link "6" [ref=f4e145] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Kløe henger sammen med fiberdiameter. Moderne merinoull med fibre tynnere enn 23 mikrometer bøyer seg mot huden og irriterer mindre
        - superscript [ref=f4e146]:
          - text: "["
          - link "6" [ref=f4e148] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: .
      - heading "Syntetisk som innerlag" [level=2] [ref=f4e149]
      - paragraph [ref=f4e150]:
        - text: Syntetiske materialer som polypropylen, polyester og polyamid er hydrofobe (vannavvisende)
        - superscript [ref=f4e151]:
          - text: "["
          - link "6" [ref=f4e153] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . De fordamper svette raskere enn mange andre tekstiler i kulde, fordi de holder lite væske i selve fiberen
        - superscript [ref=f4e154]:
          - text: "["
          - link "6" [ref=f4e156] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: .
      - paragraph [ref=f4e157]:
        - text: Lette syntetiske plagg, for eksempel polyamid, gir lavere varmetap knyttet til fordampning enn tykkere stoffer som suger svetten til seg
        - superscript [ref=f4e158]:
          - text: "["
          - link "6" [ref=f4e160] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Fukten ledes langs fiberoverflaten, vekk fra huden og ut i neste lag.
      - paragraph [ref=f4e161]:
        - text: Netting – den tradisjonelle helsetrøya – lager dype luftlag når du sitter stille med et vindlag utenpå, og ventilerer når du går fordi mer hud eksponeres og svetten fordamper fritt
        - superscript [ref=f4e162]:
          - text: "["
          - link "7" [ref=f4e164] [cursor=pointer]:
            - /url: "#kilde-7"
          - text: "]"
        - text: . Ved høy puls er tynne syntetiske materialer derfor et rasjonelt valg
        - superscript [ref=f4e165]:
          - text: "["
          - link "2" [ref=f4e167] [cursor=pointer]:
            - /url: "#kilde-2"
          - generic [ref=f4e168]:
            - text: ","
            - link "7" [ref=f4e169] [cursor=pointer]:
              - /url: "#kilde-7"
          - text: "]"
        - text: .
      - heading "Hva med bomull?" [level=2] [ref=f4e170]
      - paragraph [ref=f4e171]:
        - text: Bomull hører ikke hjemme som innerlag i kulde
        - superscript [ref=f4e172]:
          - text: "["
          - link "6" [ref=f4e174] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Fiberen er sterkt absorberende og holder på svetten over tid
        - superscript [ref=f4e175]:
          - text: "["
          - link "6" [ref=f4e177] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Den gir verken ullas varmeutvikling ved opptak eller syntetens evne til å frastøte vann. Resultatet er et klamt, kaldt lag mot huden.
      - paragraph [ref=f4e178]:
        - text: Når bomull først er våt, stjeler fordampningen varme fra huden. Forsøk viser lavere hudtemperatur i hvile med bomull innerst enn med et polypropylen-lag
        - superscript [ref=f4e179]:
          - text: "["
          - link "6" [ref=f4e181] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Uten tørt skift slutter bomull i praksis å isolere.
      - 'complementary "Tommelregel: aldri bomull innerst i kulda" [ref=f4e182]':
        - paragraph [ref=f4e183]: "Tommelregel: aldri bomull innerst i kulda"
        - paragraph [ref=f4e185]:
          - text: Har du bare ett sett, velg ull eller syntetisk. Bomull som blir våt, holder på vannet og øker varmetapet – særlig i pausen etter at du har svettet
          - superscript [ref=f4e186]:
            - text: "["
            - link "6" [ref=f4e188] [cursor=pointer]:
              - /url: "#kilde-6"
            - text: "]"
          - text: .
      - heading "Aktivitet vs. stillesitting" [level=2] [ref=f4e189]
      - paragraph [ref=f4e190]:
        - text: Valget styres av aktiviteten, fordi varmeproduksjonen skifter sterkt
        - superscript [ref=f4e191]:
          - text: "["
          - link "7" [ref=f4e193] [cursor=pointer]:
            - /url: "#kilde-7"
          - text: "]"
        - text: . Går du i motbakke med vinterbekledning, kan produksjonen bli nesten åtte ganger så høy som i hvile
        - superscript [ref=f4e194]:
          - text: "["
          - link "7" [ref=f4e196] [cursor=pointer]:
            - /url: "#kilde-7"
          - text: "]"
        - text: .
      - paragraph [ref=f4e197]:
        - text: På post, scooter eller tribune produserer du lite overskuddsvarme
        - superscript [ref=f4e198]:
          - text: "["
          - link "6" [ref=f4e200] [cursor=pointer]:
            - /url: "#kilde-6"
          - generic [ref=f4e201]:
            - text: ","
            - link "7" [ref=f4e202] [cursor=pointer]:
              - /url: "#kilde-7"
          - text: "]"
        - text: . Da er et tykkere ullplagg det tryggere valget for å holde på isolasjonen
        - superscript [ref=f4e203]:
          - text: "["
          - link "6" [ref=f4e205] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: .
      - paragraph [ref=f4e206]:
        - text: Ved langrenn, topptur eller tungt arbeid i snøen lønner det seg å starte småkjølig
        - superscript [ref=f4e207]:
          - text: "["
          - link "7" [ref=f4e209] [cursor=pointer]:
            - /url: "#kilde-7"
          - text: "]"
        - text: . Muskelarbeidet gir varme, og et syntetisk innerlag reduserer opphopning av svette
        - superscript [ref=f4e210]:
          - text: "["
          - link "2" [ref=f4e212] [cursor=pointer]:
            - /url: "#kilde-2"
          - generic [ref=f4e213]:
            - text: ","
            - link "7" [ref=f4e214] [cursor=pointer]:
              - /url: "#kilde-7"
          - text: "]"
        - text: .
      - 'complementary "Tommelregel: kle deg for farten, ikke for pausen" [ref=f4e215]':
        - paragraph [ref=f4e216]: "Tommelregel: kle deg for farten, ikke for pausen"
        - paragraph [ref=f4e218]:
          - text: Start småkald når du skal gå. Når aktiviteten stanser, skal et mellomlag på med én gang – før temperaturen rekker å falle
          - superscript [ref=f4e219]:
            - text: "["
            - link "6" [ref=f4e221] [cursor=pointer]:
              - /url: "#kilde-6"
            - generic [ref=f4e222]:
              - text: ","
              - link "7" [ref=f4e223] [cursor=pointer]:
                - /url: "#kilde-7"
            - text: "]"
          - text: .
      - heading "Hva skjer når innerlaget blir fuktig?" [level=2] [ref=f4e224]
      - paragraph [ref=f4e225]:
        - text: Når svetten setter seg i innerklærne, fortrenges den isolerende luften mellom fibrene av vann
        - superscript [ref=f4e226]:
          - text: "["
          - link "6" [ref=f4e228] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Vann har en varmeledningsevne på omtrent 0,58 W/mK mot luftens 0,024 W/mK ved samme temperatur – omtrent 24 ganger høyere. Et vått plagg stjeler derfor varme raskere enn et tørt
        - superscript [ref=f4e229]:
          - text: "["
          - link "6" [ref=f4e231] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: .
      - paragraph [ref=f4e232]:
        - text: Svette som flytter seg ut i de ytre lagene kan redusere vinterbekledningens isolasjon med opptil 25 prosent
        - superscript [ref=f4e233]:
          - text: "["
          - link "7" [ref=f4e235] [cursor=pointer]:
            - /url: "#kilde-7"
          - text: "]"
        - text: . Isolasjonen tapes omtrent lineært med hvor mye væske som ligger i tøyet
        - superscript [ref=f4e236]:
          - text: "["
          - link "6" [ref=f4e238] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Det største fallet kommer i det sekundet marsjen stanser
        - superscript [ref=f4e239]:
          - text: "["
          - link "6" [ref=f4e241] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Et tørt ull- eller syntetisk skift i sekken er den praktiske motvekten
        - superscript [ref=f4e242]:
          - text: "["
          - link "6" [ref=f4e244] [cursor=pointer]:
            - /url: "#kilde-6"
          - generic [ref=f4e245]:
            - text: ","
            - link "7" [ref=f4e246] [cursor=pointer]:
              - /url: "#kilde-7"
          - text: "]"
        - text: .
      - heading "Passform, tykkelse og konstruksjon" [level=2] [ref=f4e247]
      - paragraph [ref=f4e248]:
        - text: Tykkelse på innerlaget påvirker isolasjonen, men passform betyr minst like mye
        - superscript [ref=f4e249]:
          - text: "["
          - link "2" [ref=f4e251] [cursor=pointer]:
            - /url: "#kilde-2"
          - generic [ref=f4e252]:
            - text: ","
            - link "6" [ref=f4e253] [cursor=pointer]:
              - /url: "#kilde-6"
          - text: "]"
        - text: . Fibermassen står ofte for bare 5–20 prosent av den effektive isolasjonen; 80–95 prosent kommer fra luften mellom lagene
        - superscript [ref=f4e254]:
          - text: "["
          - link "6" [ref=f4e256] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: . Sitter klærne for stramt, presses luftlagene ut, og varmetapet øker
        - superscript [ref=f4e257]:
          - text: "["
          - link "6" [ref=f4e259] [cursor=pointer]:
            - /url: "#kilde-6"
          - generic [ref=f4e260]:
            - text: ","
            - link "7" [ref=f4e261] [cursor=pointer]:
              - /url: "#kilde-7"
          - text: "]"
        - text: .
      - paragraph [ref=f4e262]:
        - text: Åpne materialstrukturer holder mer stillestående luft enn tette
        - superscript [ref=f4e263]:
          - text: "["
          - link "6" [ref=f4e265] [cursor=pointer]:
            - /url: "#kilde-6"
          - generic [ref=f4e266]:
            - text: ","
            - link "7" [ref=f4e267] [cursor=pointer]:
              - /url: "#kilde-7"
          - text: "]"
        - text: .
      - heading "Praktisk anbefaling etter brukssituasjon" [level=2] [ref=f4e268]
      - list [ref=f4e269]:
        - listitem [ref=f4e270]:
          - strong [ref=f4e271]: "Lange fjellturer i skiftende, moderat tempo:"
          - text: Hydrofilt ull-innerlag, gjerne merino. Det varmer i pausene og tar unna en brukbar mengde svette under etappen
          - superscript [ref=f4e272]:
