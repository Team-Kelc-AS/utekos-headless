              - /url: "#hvorfor-fryser-noen-mer-enn-andre"
          - listitem [ref=f3e61]:
            - link "Myter, farer og helseeffekter av kulde" [ref=f3e62] [cursor=pointer]:
              - /url: "#myter-farer-og-helseeffekter-av-kulde"
          - listitem [ref=f3e63]:
            - link "Slik løser du problemet" [ref=f3e64] [cursor=pointer]:
              - /url: "#slik-løser-du-problemet"
          - listitem [ref=f3e65]:
            - link "Hva forskningen ikke kan si sikkert" [ref=f3e66] [cursor=pointer]:
              - /url: "#hva-forskningen-ikke-kan-si-sikkert"
          - listitem [ref=f3e67]:
            - link "Oppsummering" [ref=f3e68] [cursor=pointer]:
              - /url: "#oppsummering"
      - paragraph [ref=f3e69]: Det er en klassisk vintermorgen. To personer står og venter på bussen. Den ene tripper urolig, hakker tenner og har trukket skuldrene helt opp til ørene i et forsøk på å bevare varmen. Den andre står rolig og avslappet, tilsynelatende upåvirket av de bitende minusgradene. Hvordan kan to mennesker oppleve nøyaktig samme miljø så forskjellig? Og hva betyr det egentlig når vi sier at vi «fryser»?
      - paragraph [ref=f3e70]:
        - text: For å forstå hvorfor man blir kald, må vi legge fra oss tanken om at det kun handler om hva gradestokken viser. Å fryse er ikke en passiv hendelse der kulden «kryper inn» i kroppen. Kulde eksisterer egentlig ikke i fysikken; det vi kaller kulde, er utelukkende fravær av varmeenergi. Menneskekroppen er en biologisk ovn som kontinuerlig produserer varme, og det å bli kald er et resultat av et samspill mellom fysikk, fysiologi, atferd og omgivelser
        - superscript [ref=f3e71]:
          - text: "["
          - link "1" [ref=f3e73] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - paragraph [ref=f3e74]: Når du har lest artikkelen, vet du hva som skjer når gradestokken kryper, hvorfor fingrene blir iskalde mens brystkassen er varm, og hvilke grep som faktisk tipper varmeregnskapet.
      - figure [ref=f3e75]:
        - img "To personer på en snødekt bussholdeplass i skumringen – én som hutrer med armene i kors, én som står rolig i vinterjakke." [ref=f3e77]
      - heading "Balansen mellom varmeproduksjon og varmeavgivelse" [level=2] [ref=f3e78]
      - paragraph [ref=f3e79]:
        - text: Mennesket er av natur et tropisk pattedyr, en såkalt
        - emphasis [ref=f3e80]: homeoterm
        - text: "organisme – det vil si at vi er programmert til å holde en stabil kjernetemperatur på rundt 37 °C uavhengig av miljøet. Redskapet er termoregulering: balansen mellom varmen vi produserer (varmeproduksjon) og varmen vi mister til omgivelsene (varmeavgivelse). I faglitteraturen kalles dette kroppens varmebalanseligning: er netto varmetap lik netto varmeproduksjon, holder temperaturen seg stabil; mister vi mer enn vi produserer, synker den"
        - superscript [ref=f3e81]:
          - text: "["
          - link "1" [ref=f3e83] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - 'heading "Varmeproduksjon: Den indre ovnen" [level=3] [ref=f3e84]'
      - paragraph [ref=f3e85]:
        - text: Den menneskelige metabolismen (stoffskiftet) er kroppens motor. Levende celler tar opp oksygen og næring, og i cellenes mitokondrier omgjøres dette til energi – en stor andel frigjøres som varme, såkalt metabolsk varme
        - superscript [ref=f3e86]:
          - text: "["
          - link "1" [ref=f3e88] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - paragraph [ref=f3e89]: "Selv i full ro produserer kroppen omtrent 100 watt (basalmetabolisme), men produksjonen varierer:"
      - list [ref=f3e90]:
        - listitem [ref=f3e91]:
          - strong [ref=f3e92]: "Fysisk aktivitet:"
          - text: Muskelarbeid er den mest effektive måten å skape varme på. Under hard trening kan varmeproduksjonen tidobles
          - superscript [ref=f3e93]:
            - text: "["
            - link "1" [ref=f3e95] [cursor=pointer]:
              - /url: "#kilde-1"
            - text: "]"
          - text: .
        - listitem [ref=f3e96]:
          - strong [ref=f3e97]: "Matfordøyelse:"
          - text: Et måltid øker forbrenningen midlertidig med opptil 20 prosent
          - superscript [ref=f3e98]:
            - text: "["
            - link "1" [ref=f3e100] [cursor=pointer]:
              - /url: "#kilde-1"
            - text: "]"
          - text: .
        - listitem [ref=f3e101]:
          - strong [ref=f3e102]: "Skjelving:"
          - text: Merker kroppen at den mister for mye varme, starter ufrivillige muskelsammentrekninger som øker varmeproduksjonen betraktelig – men til høy energikostnad
          - superscript [ref=f3e103]:
            - text: "["
            - link "1" [ref=f3e105] [cursor=pointer]:
              - /url: "#kilde-1"
            - text: "]"
          - text: .
        - listitem [ref=f3e106]:
          - strong [ref=f3e107]: "Brunt fett:"
          - text: Kroppen kan også produsere varme uten å skjelve ved å forbrenne brunt fett, et vev som har som eneste oppgave å holde kjernetemperaturen oppe
          - superscript [ref=f3e108]:
            - text: "["
            - link "1" [ref=f3e110] [cursor=pointer]:
              - /url: "#kilde-1"
            - text: "]"
          - text: .
      - 'heading "Varmeavgivelse: Slik stjeler omgivelsene energien din" [level=3] [ref=f3e111]'
      - paragraph [ref=f3e112]:
        - text: "Mange tror det kun er lufttemperaturen som avgjør om vi fryser. Det er en myte. Lufttemperaturen er bare én av flere veier varmen forlater kroppen på. Termisk balanse beskrives med seks parametere: lufttemperatur, strålingstemperatur, luftfuktighet og vindhastighet (omgivelsene), samt bekledning og metabolsk rate (individet)"
        - superscript [ref=f3e113]:
          - text: "["
          - link "1" [ref=f3e115] [cursor=pointer]:
            - /url: "#kilde-1"
          - generic [ref=f3e116]:
            - text: ","
            - link "3" [ref=f3e117] [cursor=pointer]:
              - /url: "#kilde-3"
          - text: "]"
        - text: .
      - paragraph [ref=f3e118]: "Varmen forlater kroppen på fire måter:"
      - list [ref=f3e119]:
        - listitem [ref=f3e120]:
          - strong [ref=f3e121]: "Konveksjon (varmetap til luft i bevegelse):"
          - text: Varme avgis til luften som strømmer over huden. I vindstille varmer kroppen et tynt luftlag ved huden som isolerer; blåser det, fjernes laget og erstattes av kald luft. Derfor føles minus 5 grader i kuling kaldere enn minus 15 i vindstille – den såkalte vindavkjølingen
          - superscript [ref=f3e122]:
            - text: "["
            - link "3" [ref=f3e124] [cursor=pointer]:
              - /url: "#kilde-3"
            - text: "]"
          - text: .
        - listitem [ref=f3e125]:
          - strong [ref=f3e126]: "Konduksjon (direkte kontakt):"
          - text: Varme ledes over i materialer vi berører. En kald stein eller kaldt underlag trekker varme ut av kroppen langs en termisk gradient. Vann leder varme omtrent 25 ganger raskere enn luft, som gjør fuktighet farlig i kulda
          - superscript [ref=f3e127]:
            - text: "["
            - link "1" [ref=f3e129] [cursor=pointer]:
              - /url: "#kilde-1"
            - generic [ref=f3e130]:
              - text: ","
              - link "3" [ref=f3e131] [cursor=pointer]:
                - /url: "#kilde-3"
            - text: "]"
          - text: .
        - listitem [ref=f3e132]:
          - strong [ref=f3e133]: "Stråling:"
          - text: Kroppen sender kontinuerlig ut infrarød varmestråling og utveksler den med alle flater rundt seg. Under skyfri vinternatt stråler du store mengder varme rett mot den kalde himmelen
          - superscript [ref=f3e134]:
            - text: "["
            - link "1" [ref=f3e136] [cursor=pointer]:
              - /url: "#kilde-1"
            - generic [ref=f3e137]:
              - text: ","
              - link "3" [ref=f3e138] [cursor=pointer]:
                - /url: "#kilde-3"
            - text: "]"
          - text: .
        - listitem [ref=f3e139]:
          - strong [ref=f3e140]: "Fordampning:"
          - text: "Når svette eller fukt på huden blir til damp, tas varmeenergien fra huden. Derfor er svetting og våte klær en direkte risiko i kulda: fuktige klær gir et stort og vedvarende varmetap til fukten er borte"
          - superscript [ref=f3e141]:
            - text: "["
            - link "1" [ref=f3e143] [cursor=pointer]:
              - /url: "#kilde-1"
            - text: "]"
          - text: .
      - paragraph [ref=f3e144]: Ubehag i kulda forklares derfor aldri med lufttemperatur alene. Det er summen av vind, fuktighet, strålingstap og manglende bekledning som tipper varmebalansen feil vei.
      - 'heading "Termoregulering: Slik forsvarer kroppen seg" [level=2] [ref=f3e145]'
      - paragraph [ref=f3e146]:
        - text: Når varmetapet overstiger varmeproduksjonen, går alarmen. Systemet styres av hypothalamus, en struktur dypt i hjernen som fungerer som kroppens termostat. Den mottar signaler fra kulde- og varmesensorer (blant annet TRPM8-ionekanaler) i hud og kroppskjerne
        - superscript [ref=f3e147]:
          - text: "["
          - link "1" [ref=f3e149] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - paragraph [ref=f3e150]:
        - text: "Synker hudtemperaturen nedover fra behagelige 33–34 °C, setter hypothalamus inn et todelt forsvar:"
        - emphasis [ref=f3e151]: fysiologisk
        - text: termoregulering (det kroppen gjør automatisk) og
        - emphasis [ref=f3e152]: atferdsmessig
        - text: termoregulering (det du velger å gjøre, som å lukke jakken)
        - superscript [ref=f3e153]:
          - text: "["
          - link "1" [ref=f3e155] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - heading "Blodårene trekker seg sammen (Vasokonstriksjon)" [level=3] [ref=f3e156]
      - paragraph [ref=f3e157]:
        - text: "Den viktigste – og mest misforståtte – reaksjonen på kulde er perifer vasokonstriksjon: det sympatiske nervesystemet får de små blodårene ytterst i huden, særlig i armer og bein, til å snurpe seg sammen for å bevare varmen rundt hjerne og indre organer"
        - superscript [ref=f3e158]:
          - text: "["
          - link "1" [ref=f3e160] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - paragraph [ref=f3e161]:
        - text: Når blodtilførselen til huden strupes, og blodet er kroppens sentralfyr som frakter varme til overflaten, blir hud og ekstremiteter raskt nedkjølt. Huden overtar i praksis rollen som isolerende skjold for resten av kroppen
        - superscript [ref=f3e162]:
          - text: "["
          - link "1" [ref=f3e164] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - paragraph [ref=f3e165]:
        - text: "Dette er kroppens kompromiss:"
        - strong [ref=f3e166]: huden og kroppsdelene blir kalde nettopp for at kjernen ikke skal bli det.
        - text: Kaldfølelsen på huden er ikke nødvendigvis tegn på at kroppen svikter – den viser at overlevelsesmekanismen virker. Varmen bevares sentralt på bekostning av periferien
        - superscript [ref=f3e167]:
          - text: "["
          - link "1" [ref=f3e169] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - heading "Jakten på varmen (CIVD)" [level=3] [ref=f3e170]
      - paragraph [ref=f3e171]:
        - text: "Kroppen kan ikke stenge blodtilførselen til hender og føtter varig uten at vevet tar skade av oksygenmangel eller forfrysning. Derfor finnes kuldeindusert vasodilatasjon (CIVD, «hunting response»): faller hudtemperaturen mot farlige nivåer, ofte under 12 °C, tvinger kroppen årene kortvarig opp. Varmt blod sendes ut til fingre, kinn eller tær før årene lukkes igjen – det er dette som gir blussende røde kinn på kalde dager, selv om resten av huden er blek"
        - superscript [ref=f3e172]:
          - text: "["
          - link "1" [ref=f3e174] [cursor=pointer]:
            - /url: "#kilde-1"
          - generic [ref=f3e175]:
            - text: ","
            - link "2" [ref=f3e176] [cursor=pointer]:
              - /url: "#kilde-2"
          - text: "]"
        - text: .
      - heading "Tre forskjellige opplevelser av kulde" [level=2] [ref=f3e177]
      - paragraph [ref=f3e178]:
        - text: "Det er viktig å skille ubehag fra livsfare. Mange kaller all kuldefølelse hypotermi (nedkjøling), men fysiologisk er det tre ulike tilstander: å kjenne seg kald, å få kalde kroppsdeler og å utvikle betydelig nedkjøling"
        - superscript [ref=f3e179]:
          - text: "["
          - link "1" [ref=f3e181] [cursor=pointer]:
            - /url: "#kilde-1"
          - generic [ref=f3e182]:
            - text: ","
            - link "6" [ref=f3e183] [cursor=pointer]:
              - /url: "#kilde-6"
          - text: "]"
        - text: .
      - heading "1. Å kjenne seg kald (Termisk ubehag)" [level=3] [ref=f3e184]
      - paragraph [ref=f3e185]:
        - text: Å «fryse» er i stor grad en subjektiv opplevelse utløst av sensorsignaler, lenge før kjernetemperaturen har sunket. Eksponeres huden for kald trekk, synker den lokale hudtemperaturen og kuldereseptorene sender kraftige signaler til hjernen, som tolker dem som
        - emphasis [ref=f3e186]: termisk ubehag
        - text: – bevissthetens måte å drive
        - emphasis [ref=f3e187]: atferdsmessig termoregulering
        - text: "på: «ta på deg en genser før dette blir et reelt problem»"
        - superscript [ref=f3e188]:
          - text: "["
          - link "1" [ref=f3e190] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - paragraph [ref=f3e191]:
        - text: "Hutrer du på bussholdeplassen, er kjernen fremdeles 37 °C. Ubehaget er ekte, men uten fysiologisk fare. Termisk følsomhet er ujevnt fordelt: ansikt og mage er svært følsomme, og hjernen baserer ofte totalopplevelsen på signalene derfra"
        - superscript [ref=f3e192]:
          - text: "["
          - link "1" [ref=f3e194] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - heading "2. Å få kalde kroppsdeler (Perifer nedkjøling)" [level=3] [ref=f3e195]
      - paragraph [ref=f3e196]:
        - text: Dette skjer når kroppen har strupt blodtilførselen til ekstremitetene for å redde kjernen. Hender, føtter, nese og ører blir bokstavelig talt iskalde, og vevstemperaturen kan falle dramatisk
        - superscript [ref=f3e197]:
          - text: "["
          - link "1" [ref=f3e199] [cursor=pointer]:
            - /url: "#kilde-1"
          - generic [ref=f3e200]:
            - text: ","
            - link "2" [ref=f3e201] [cursor=pointer]:
              - /url: "#kilde-2"
          - text: "]"
        - text: .
      - paragraph [ref=f3e202]:
        - text: Ekstremitetene har et høyt overflate-til-masse-forhold og avgir varme raskt. I tillegg ligger kaldt blod på retur i venene inntil pulsårene med varmt blod fra hjertet – et motstrømsprinsipp som forvarmer blodet tilbake til kjernen, men gir fingre og tær enda mindre varme
        - superscript [ref=f3e203]:
          - text: "["
          - link "1" [ref=f3e205] [cursor=pointer]:
            - /url: "#kilde-1"
          - generic [ref=f3e206]:
            - text: ","
            - link "2" [ref=f3e207] [cursor=pointer]:
              - /url: "#kilde-2"
          - text: "]"
        - text: .
      - paragraph [ref=f3e208]:
        - text: Kalde kroppsdeler gir konkrete utfordringer. Faller muskel- og nervetemperaturen under 15 °C, kommer smerter, svekket muskelstyrke, dårligere finmotorikk og lengre reaksjonstid. Under 10 °C i fingrene blir vi numne, og faren for lokale vevsskader øker sterkt
        - superscript [ref=f3e209]:
          - text: "["
          - link "2" [ref=f3e211] [cursor=pointer]:
            - /url: "#kilde-2"
          - generic [ref=f3e212]:
            - text: ","
            - link "6" [ref=f3e213] [cursor=pointer]:
              - /url: "#kilde-6"
          - text: "]"
        - text: .
      - figure [ref=f3e214]:
        - img "Nærbilde av de to på bussholdeplassen – den ene hutrer med hendene under armene, den andre står rolig mens bussen kommer." [ref=f3e216]
      - heading "3. Betydelig nedkjøling av kroppen (Hypotermi)" [level=3] [ref=f3e217]
      - paragraph [ref=f3e218]:
        - text: Først når varmetapet over tid har overgått varmeproduksjonen så mye at kjernetemperaturen faller under 35 °C, oppstår
        - emphasis [ref=f3e219]: aksidentell hypotermi
        - text: – en kritisk medisinsk tilstand, noe helt annet enn å «kjenne seg kald»
        - superscript [ref=f3e220]:
          - text: "["
          - link "1" [ref=f3e222] [cursor=pointer]:
            - /url: "#kilde-1"
          - generic [ref=f3e223]:
            - text: ","
            - link "6" [ref=f3e224] [cursor=pointer]:
              - /url: "#kilde-6"
          - text: "]"
        - text: ":"
      - list [ref=f3e225]:
        - listitem [ref=f3e226]:
          - strong [ref=f3e227]: "Mild hypotermi (32–35 °C):"
          - text: Kroppen kjemper imot. Skjelvingen er maksimal, puls og pust øker, og man blir ofte apatisk med svekket dømmekraft
          - superscript [ref=f3e228]:
            - text: "["
            - link "1" [ref=f3e230] [cursor=pointer]:
              - /url: "#kilde-1"
            - generic [ref=f3e231]:
              - text: ","
              - link "6" [ref=f3e232] [cursor=pointer]:
                - /url: "#kilde-6"
            - text: "]"
          - text: .
        - listitem [ref=f3e233]:
          - strong [ref=f3e234]: "Moderat hypotermi (28–32 °C):"
          - text: Kroppen gir opp skjelvingen av energimangel eller for kalde muskler. Tapt skjelverefleks er et farlig tegn. Hjerterytmen svekkes, personen blir forvirret og talen svikter
          - superscript [ref=f3e235]:
            - text: "["
            - link "1" [ref=f3e237] [cursor=pointer]:
              - /url: "#kilde-1"
            - generic [ref=f3e238]:
              - text: ","
              - link "6" [ref=f3e239] [cursor=pointer]:
                - /url: "#kilde-6"
            - text: "]"
          - text: .
        - listitem [ref=f3e240]:
          - strong [ref=f3e241]: "Alvorlig hypotermi (under 28 °C):"
          - text: Bevissthetstap, svak puls og pust, betydelig fare for hjertestans og død
          - superscript [ref=f3e242]:
            - text: "["
            - link "6" [ref=f3e244] [cursor=pointer]:
              - /url: "#kilde-6"
            - text: "]"
          - text: .
      - paragraph [ref=f3e245]:
        - text: Behandlingen av «bare kald på huden» og moderat hypotermi er helt forskjellig. En lett frossen person bør bevege seg for å øke forbrenningen. Ved dyp hypotermi er hjertemuskulaturen så kald og skjør at røff håndtering eller brå oppvarming av ekstremitetene kan sende iskaldt blod tilbake til hjertet (afterdrop) og utløse hjerteflimmer
        - superscript [ref=f3e246]:
          - text: "["
          - link "6" [ref=f3e248] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: .
      - heading "Hvorfor fryser noen mer enn andre?" [level=2] [ref=f3e249]
      - paragraph [ref=f3e250]:
        - text: Kjernetemperaturen styres likt, men folk fryser forskjellig. Årsaken ligger i individuelle fysiologiske forskjeller
        - superscript [ref=f3e251]:
          - text: "["
          - link "1" [ref=f3e253] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - heading "Kroppsfasong og isolasjon" [level=3] [ref=f3e254]
      - paragraph [ref=f3e255]:
        - text: "Fett er et effektivt isolasjonsmateriale: et tykkere underhudsfett legger demper varmetapet. Like viktig er overflate-til-volum-forholdet. Små, slanke personer – og særlig barn – har stor hudoverflate i forhold til kroppsmassen. Siden varmeproduksjonen avhenger av massen og varmetapet skjer fra overflaten, kjøles små mennesker raskere ned og opplever kulde tidligere"
        - superscript [ref=f3e256]:
          - text: "["
          - link "1" [ref=f3e258] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - heading "Alder og fitness" [level=3] [ref=f3e259]
      - paragraph [ref=f3e260]:
        - text: Med alderen svekkes den termiske følsomheten – vi merker kulden dårligere, noe som øker risikoen for nedkjøling uten forvarsel. Samtidig reduseres evnen til kraftig vasokonstriksjon fordi blodkarene blir stivere, slik at eldre taper mer varme. Mindre muskelmasse gir også svakere varmeproduksjon gjennom skjelving. Godt trente har gjerne høyere basalmetabolisme og holder varmeproduksjonen oppe lenger i bevegelse, men mangler isolasjon i ro ved svært lav fettprosent
        - superscript [ref=f3e261]:
          - text: "["
          - link "1" [ref=f3e263] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - heading "Tilvenning (Akklimatisering)" [level=3] [ref=f3e264]
      - paragraph [ref=f3e265]:
        - text: Mennesker tilpasser seg kulde. Den vanligste formen hos moderne mennesker er
        - emphasis [ref=f3e266]: habituering
        - text: "(tilvenning): ved jevnlig, moderat kuldeeksponering uten dyp nedkjøling lærer kroppen at situasjonen ikke er livstruende. Skjelverefleksen slår inn senere, stressresponsen dempes og ubehaget reduseres kraftig"
        - superscript [ref=f3e267]:
          - text: "["
          - link "1" [ref=f3e269] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - paragraph [ref=f3e270]:
        - text: Ved langvarig liv ute i ekstrem kulde er også
        - emphasis [ref=f3e271]: insulativ akklimatisering
        - text: (kaldere, mer isolerende hud) og
        - emphasis [ref=f3e272]: metabolsk akklimatisering
        - text: (høyere grunnforbrenning) dokumentert. Vinterbadere som bader ukentlig, tåler isvannet bedre i mars enn i november fordi alarmresponsen er dempet
        - superscript [ref=f3e273]:
          - text: "["
          - link "1" [ref=f3e275] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - heading "Myter, farer og helseeffekter av kulde" [level=2] [ref=f3e276]
      - paragraph [ref=f3e277]:
        - text: Forskningen gir gode svar på hva som er farlig og ikke. Kuldeforskningen har avkreftet flere myter mange har vokst opp med
        - superscript [ref=f3e278]:
          - text: "["
          - link "4" [ref=f3e280] [cursor=pointer]:
            - /url: "#kilde-4"
          - generic [ref=f3e281]:
            - text: ","
            - link "5" [ref=f3e282] [cursor=pointer]:
              - /url: "#kilde-5"
          - text: "]"
        - text: .
      - 'heading "Myte 1: Du mister mesteparten av varmen ut gjennom hodet" [level=3] [ref=f3e283]'
      - paragraph [ref=f3e284]:
        - text: Dette er feil. Varmetap handler om isolasjon, og hud taper varme jevnt – at hodet
        - emphasis [ref=f3e285]: virket
        - text: verst i tidlige forsøk, skyldes at det var den eneste kroppsdelen testpersonene ikke hadde pakket inn
        - superscript [ref=f3e286]:
          - text: "["
          - link "4" [ref=f3e288] [cursor=pointer]:
            - /url: "#kilde-4"
          - generic [ref=f3e289]:
            - text: ","
            - link "5" [ref=f3e290] [cursor=pointer]:
              - /url: "#kilde-5"
          - text: "]"
        - text: ". Men ansikt, hode og nakke er tette med termoreseptorer: blir du kald her, melder hjernen at hele du er kald. En lue hjelper godt fordi den stopper varmetapet på et svært følsomt område – ikke fordi hodet stråler mer varme enn leggene"
        - superscript [ref=f3e291]:
          - text: "["
          - link "1" [ref=f3e293] [cursor=pointer]:
            - /url: "#kilde-1"
          - generic [ref=f3e294]:
            - text: ","
            - link "5" [ref=f3e295] [cursor=pointer]:
              - /url: "#kilde-5"
          - text: "]"
        - text: .
      - paragraph [ref=f3e296]:
        - text: Motsatt har lår og legger færre sensorer, så mange tror tynne jeans er greit med dunjakke over. Realiteten er at beina da kan stå for over halvparten av kroppens totale varmetap og trekker store mengder energi fra kjernen. En stillongs lønner seg ofte mer enn en ekstra genser
        - superscript [ref=f3e297]:
          - text: "["
          - link "5" [ref=f3e299] [cursor=pointer]:
            - /url: "#kilde-5"
          - text: "]"
        - text: .
      - 'heading "Myte 2: Du blir syk av å fryse på føttene" [level=3] [ref=f3e300]'
      - paragraph [ref=f3e301]:
        - text: Vi blir syke av virus og bakterier, ikke av lav temperatur alene. Det finnes ikke belegg for at kulde fra bakken skaper influensa. Nyere forskning viser likevel at kald luft demper immunforsvaret lokalt i nese og luftveier, slik at forkjølelsesvirus lettere får fotfeste. Sykdommen skyldes viruset, men miljøet gjør kroppen mer mottakelig
        - superscript [ref=f3e302]:
          - text: "["
          - link "4" [ref=f3e304] [cursor=pointer]:
            - /url: "#kilde-4"
          - generic [ref=f3e305]:
            - text: ","
            - link "5" [ref=f3e306] [cursor=pointer]:
              - /url: "#kilde-5"
          - text: "]"
        - text: .
      - heading "Frostskader" [level=3] [ref=f3e307]
      - paragraph [ref=f3e308]:
        - text: I kombinasjon med vind kan huden fryse på få minutter. Kroppsdeler uten blodtilførsel – som følge av kroppens egen vasokonstriksjon – danner iskrystaller i og utenfor cellene, og vevet ødelegges. Det starter gjerne med intens kuldefølelse, fulgt av en hvit, nummen flekk. Varm området umiddelbart mot varm hud. Gni aldri på skaden, og varm den aldri opp hvis vevet kan fryse på nytt – gjentatte fryse-tine-sykluser gir alvorlige vevsskader
        - superscript [ref=f3e309]:
          - text: "["
          - link "4" [ref=f3e311] [cursor=pointer]:
            - /url: "#kilde-4"
          - generic [ref=f3e312]:
            - text: ","
            - link "6" [ref=f3e313] [cursor=pointer]:
              - /url: "#kilde-6"
          - text: "]"
        - text: .
      - heading "Slik løser du problemet" [level=2] [ref=f3e314]
      - paragraph [ref=f3e315]:
        - text: "For å unngå å fryse må du vippe varmebalansen i din favør. Siden kjernetemperaturen alltid er kroppens førsteprioritet, er løsningen todelt: øk varmeproduksjonen og stans varmeavgivelsen"
        - superscript [ref=f3e316]:
          - text: "["
          - link "1" [ref=f3e318] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - heading "1. Stans varmeavgivelsen" [level=3] [ref=f3e319]
      - paragraph [ref=f3e320]:
        - text: Målet med klær er å fange stillestående luft – verdens letteste isolator. Klær varmer ikke; de bevarer varmen du selv produserer
        - superscript [ref=f3e321]:
          - text: "["
          - link "5" [ref=f3e323] [cursor=pointer]:
            - /url: "#kilde-5"
          - text: "]"
        - text: .
      - list [ref=f3e324]:
        - listitem [ref=f3e325]:
          - strong [ref=f3e326]: "Flerlagsprinsippet:"
          - text: Flere tynne lag slår én tykk jakke. Luftlagene mellom plaggene fanger varmen, og du kan drive
          - emphasis [ref=f3e327]: atferdsmessig termoregulering
          - text: ved å ta av et plagg når du svetter
          - superscript [ref=f3e328]:
            - text: "["
            - link "5" [ref=f3e330] [cursor=pointer]:
              - /url: "#kilde-5"
            - text: "]"
          - text: .
        - listitem [ref=f3e331]:
          - strong [ref=f3e332]: "Materialvalg:"
          - text: Fuktighet er hovedfienden i kulda. Ull beholder mye av isolasjonsevnen også i fuktig tilstand, mens syntetisk tøy flytter svette raskt vekk – styrker og svakheter ved hvert materiale forklarer vi i
          - link "artikkelen om innerlag" [ref=f3e333] [cursor=pointer]:
            - /url: /kunnskap/hva-skal-man-ha-innerst
          - superscript [ref=f3e334]:
            - text: "["
            - link "5" [ref=f3e336] [cursor=pointer]:
              - /url: "#kilde-5"
            - text: "]"
          - text: .
        - listitem [ref=f3e337]:
          - strong [ref=f3e338]: "Hold føttene tørre og isolert:"
          - text: "Skotøyet må være romslig. Trange sko klemmer luftlommene i sokkene flate og struper blodsirkulasjonen. Et gammelt triks som fortsatt virker: såler av avispapir under ullsålen suger fukt og isolerer mot kald bakke"
          - superscript [ref=f3e339]:
            - text: "["
            - link "5" [ref=f3e341] [cursor=pointer]:
              - /url: "#kilde-5"
            - text: "]"
          - text: .
      - 'complementary "Tommelregel: kle deg for farten, ikke for pausen" [ref=f3e342]':
        - paragraph [ref=f3e343]: "Tommelregel: kle deg for farten, ikke for pausen"
        - paragraph [ref=f3e345]:
          - text: Du skal være litt småkald når turen starter. Blir du god og varm før du har begynt å gå, overopphetes du, svetter ut klærne – og fryser i første pause
          - superscript [ref=f3e346]:
            - text: "["
            - link "4" [ref=f3e348] [cursor=pointer]:
              - /url: "#kilde-4"
            - generic [ref=f3e349]:
              - text: ","
              - link "5" [ref=f3e350] [cursor=pointer]:
                - /url: "#kilde-5"
            - text: "]"
          - text: .
      - heading "2. Øk varmeproduksjonen" [level=3] [ref=f3e351]
      - paragraph [ref=f3e352]:
        - text: "Er huden kald til tross for klærne, finnes bare én utvei: øk motorens turtall"
        - superscript [ref=f3e353]:
          - text: "["
          - link "1" [ref=f3e355] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - list [ref=f3e356]:
        - listitem [ref=f3e357]:
          - strong [ref=f3e358]: "Fysisk aktivitet:"
          - text: Fryser du på post eller holdeplass, ta spensthopp, kneløft eller raske knebøy. Muskelkontraksjoner genererer varme umiddelbart og tvinger sirkulasjonen opp. Kroppen trenger drivstoff – mat, særlig karbohydrater og fett – for å produsere varme, så en sjokoladebit eller varm, søt drikke hjelper ovnen
          - superscript [ref=f3e359]:
            - text: "["
            - link "1" [ref=f3e361] [cursor=pointer]:
              - /url: "#kilde-1"
            - generic [ref=f3e362]:
              - text: ","
              - link "4" [ref=f3e363] [cursor=pointer]:
                - /url: "#kilde-4"
            - text: "]"
          - text: .
        - listitem [ref=f3e364]:
          - strong [ref=f3e365]: "Slik redder du neglespretten:"
          - text: Iskalde fingre på skitur skyldes at kroppen har strupt blodtilførselen (vasokonstriksjon) for å prioritere kjernen. Gå deg varm, og
          - emphasis [ref=f3e366]: stopp så opp
          - text: . Når arbeidet stanser mens kjernen fortsatt er litt forhøyet, sender kroppen overskuddsvarme ut i huden. La armene henge slapt og sving dem i store sirkler – sentrifugalkraften presser varmt blod helt ut i fingertuppene. Det gjør vondt i noen sekunder når varmen treffer iskalde nerver, men fingrene reddes
          - superscript [ref=f3e367]:
            - text: "["
            - link "2" [ref=f3e369] [cursor=pointer]:
              - /url: "#kilde-2"
            - generic [ref=f3e370]:
              - text: ","
              - link "4" [ref=f3e371] [cursor=pointer]:
                - /url: "#kilde-4"
            - text: "]"
          - text: .
      - heading "3. Mat og drikke" [level=3] [ref=f3e372]
      - paragraph [ref=f3e373]:
        - text: Fysiologien krever væske og energi. Mange glemmer å drikke i kulda fordi kulden demper tørsten og trekker blodkarene sammen. Vasokonstriksjonen lurer kroppen til å tro at væskevolumet sentralt er for høyt, nyrene skiller ut væske – derfor må du tisse når du blir kald – og resultatet kan bli dehydrering. Lavere blodvolum gjør det tyngre for hjertet å pumpe varmt blod til huden. Drikk jevnlig også i kulda
        - superscript [ref=f3e374]:
          - text: "["
          - link "1" [ref=f3e376] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - heading "Hva forskningen ikke kan si sikkert" [level=2] [ref=f3e377]
      - paragraph [ref=f3e378]:
        - text: Mye er godt dokumentert i laboratorium, men overføringen til virkelige liv har grenser. Individuell kuldetoleranse spriker kraftig med alder, fettprosent, form, muskelmasse og sykdom – laboratoriefunn på unge, friske forsøkspersoner kan ikke uten videre gjelde alle
        - superscript [ref=f3e379]:
          - text: "["
          - link "1" [ref=f3e381] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: . Vindavkjølingsindekser og isolasjonsstandarder som ISO 11079 beskriver standardiserte forhold, ikke din konkrete kombinasjon av svette, vindkast, bekledning og dagsform
        - superscript [ref=f3e382]:
          - text: "["
          - link "3" [ref=f3e384] [cursor=pointer]:
            - /url: "#kilde-3"
          - generic [ref=f3e385]:
            - text: ","
            - link "7" [ref=f3e386] [cursor=pointer]:
              - /url: "#kilde-7"
          - text: "]"
        - text: . Og for materialspørsmål – nøyaktig hvor mye bedre ull enn syntetisk er i felt over en hel dag – varierer resultatene med forsøksoppsett, slik vi beskriver i artikkelen om
        - link "hva du bør ha innerst" [ref=f3e387] [cursor=pointer]:
          - /url: /kunnskap/hva-skal-man-ha-innerst
        - text: .
      - heading "Oppsummering" [level=2] [ref=f3e388]
      - paragraph [ref=f3e389]:
        - text: "Neste gang du står i vinterkulden med iskalde fingre eller hutrer lett, er det ikke tegn på at kroppen svikter. Kuldefølelsen viser at termoreguleringen virker: hypothalamus har registrert at omgivelsene – gjennom stråling, konduksjon, konveksjon og fordampning – prøver å stjele kroppsvarmen, og har strupt blodtilførselen til hud og ekstremiteter for å verne hjerne og indre organer. Ubehaget er ikke farlig hypotermi, men hjernens bestemte anmodning om at du tar grep"
        - superscript [ref=f3e390]:
          - text: "["
          - link "1" [ref=f3e392] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - paragraph [ref=f3e393]: Lytt til den. Lukk jakken for å stanse konveksjonen. Få føttene opp fra bakken for å stanse konduksjonen. Ta på lue og ull for å fange stillestående luft. Og holder ikke det – ta 15 raske spensthopp. Du er ikke et offer for miljøet. Kroppen er en varmepumpe – du må vite hvilke knapper du trykker på.
      - paragraph [ref=f3e394]:
        - link "Tilbake til toppen av artikkelen" [ref=f3e395] [cursor=pointer]:
          - /url: "#top"
          - generic [aria-hidden] [ref=f3e396]: ↑
          - text: Tilbake til toppen
      - region [ref=f3e397]:
        - group [ref=f3e398]:
          - generic "Kilder (7)" [ref=f3e399] [cursor=pointer]
