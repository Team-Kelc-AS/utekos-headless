        - heading "Hvorfor blir man kald?" [level=1] [ref=f3e32]
        - paragraph [ref=f3e33]: Å fryse er ikke kulde som kryper inn. Kroppen produserer varme, og omgivelsene tar den. Forstå termoregulering, mytene om varmetap, og hva som faktisk tipper balansen.
        - complementary "Forfatter og publiseringsinformasjon" [ref=f3e34]:
