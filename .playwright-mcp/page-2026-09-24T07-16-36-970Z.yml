      - region [ref=f3e43]:
        - heading "Hva du vil lære" [level=2] [ref=f3e44]
        - list [ref=f3e45]:
          - listitem [ref=f3e46]: "Kroppens varmebalanse: samspillet mellom indre varmeproduksjon og varmeavgivelse til omgivelsene."
          - listitem [ref=f3e47]: Forskjellen på å kjenne seg kald på huden og å utvikle farlig nedkjøling av kjernetemperaturen.
          - listitem [ref=f3e48]: "Derfor fryser du på hendene: vasokonstriksjon prioriterer varme til de vitale organene."
          - listitem [ref=f3e49]: "Miljøfaktorenes rolle: hvorfor vind, fuktighet og kontakt med kalde overflater betyr like mye som lufttemperaturen."
      - navigation [ref=f3e50]:
        - heading "I denne artikkelen" [level=2] [ref=f3e51]
        - list [ref=f3e52]:
