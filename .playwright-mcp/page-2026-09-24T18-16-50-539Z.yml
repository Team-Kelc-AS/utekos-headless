                    - heading "I båten" [level=3] [ref=e355]
                    - paragraph [ref=e358]: Nyt solnedgangen fra dekk uten å la den kalde sjøbrisen ødelegge øyeblikket. Den beskytter mot trekk og lar deg forlenge båtkvelden i ren komfort.
