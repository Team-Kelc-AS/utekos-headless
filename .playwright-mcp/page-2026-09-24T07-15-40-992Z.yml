            - /url: "#kilde-9"
          - text: "]"
        - text: ". Sving armene i store sirkler: sentrifugalkraften presser blodet ut i fingertuppene."
      - 'complementary "Tommelregel: votter når det er skikkelig kaldt" [ref=e269]':
        - paragraph [ref=e270]: "Tommelregel: votter når det er skikkelig kaldt"
        - paragraph [ref=e272]:
          - text: Votter har mindre overflate enn fem separate fingre. Mindre overflate gir mindre tap. Blir det for varmt, bytt til hansker. Skoene skal være romslige, slik at luften isolerer og ingenting strammer over vristen
