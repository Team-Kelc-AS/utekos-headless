          - link "1" [ref=e286] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: . Når kjernetemperaturen synker mot 35 °C (starten på hypotermi), svekkes fingerferdighet og muskelstyrke, og skjelvingen blir ukontrollert – kroppens siste forsøk på muskulær varmeproduksjon. Videre fall påvirker dømmekraften
        - superscript [ref=e287]:
