      - paragraph [ref=e76]:
        - text: "Mange tror at det å holde varmen bare handler om en tykkest mulig jakke. Regnestykket er mer presist: kroppen produserer varme, og klærne endrer hvor fort den forsvinner – gjennom luftlag, fukt, vind og blodsirkulasjon"
        - superscript [ref=e77]:
          - text: "["
          - link "1" [ref=e79] [cursor=pointer]:
            - /url: "#kilde-1"
          - generic [ref=e80]:
            - text: ","
            - link "2" [ref=e81] [cursor=pointer]:
              - /url: "#kilde-2"
          - text: "]"
        - text: . Denne artikkelen går gjennom varmeregnskapet, lag-på-lag, og det som skjer når du går, sitter stille, blir våt eller mister varmen i hender og føtter.
      - heading "Hva bestemmer om du holder varmen?" [level=2] [ref=e82]
      - paragraph [ref=e83]:
        - text: Menneskekroppen kan beskrives som et varmeregnskap. Kjernen skal holdes nær 37 °C; skallet – hud, fett og overflatemuskulatur – kan variere for å verne kjernen
        - superscript [ref=e84]:
          - text: "["
          - link "2" [ref=e86] [cursor=pointer]:
            - /url: "#kilde-2"
          - text: "]"
        - text: . Metabolsk varmeproduksjon minus mekanisk arbeid skal veies mot tap gjennom fordampning, stråling, konveksjon (vind) og ledning (kontakt). Er tapet større enn produksjonen, synker den lagrede varmen, og du fryser
        - superscript [ref=e87]:
          - text: "["
          - link "2" [ref=e89] [cursor=pointer]:
            - /url: "#kilde-2"
          - text: "]"
        - text: .
      - paragraph [ref=e90]:
        - text: "Evnen til å holde balansen påvirkes av utmattelse: en sliten kropp har ofte svekket varmeproduserende respons"
        - superscript [ref=e91]:
          - text: "["
          - link "1" [ref=e93] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: . Vasokonstriksjon – innsnevring av blodårer i huden – styres av det sympatiske nervesystemet når hud- og kjernetemperatur faller
        - superscript [ref=e94]:
          - text: "["
          - link "1" [ref=e96] [cursor=pointer]:
            - /url: "#kilde-1"
          - text: "]"
        - text: .
      - paragraph [ref=e97]:
        - text: ISO 11079 beregner nødvendig klesisolasjon (IREQ, ofte i clo eller m²K/W) ut fra temperatur, vind og fukt, for å unngå både lokal nedkjøling og hypotermi
        - superscript [ref=e98]:
          - text: "["
          - link "10" [ref=e100] [cursor=pointer]:
            - /url: "#kilde-10"
          - text: "]"
        - text: ". Standarden behandler komfort i kulde som et regnestykke: du må isolere proporsjonalt med det miljøet stjeler, minus det du produserer selv"
        - superscript [ref=e101]:
          - text: "["
          - link "10" [ref=e103] [cursor=pointer]:
            - /url: "#kilde-10"
          - text: "]"
        - text: .
      - heading "Aktivitet kontra stillesitting" [level=2] [ref=e104]
      - paragraph [ref=e105]: I ro er den metabolske varmeproduksjonen lav. Da er du avhengig av isolasjonen i klærne. Når du beveger deg, endres fysiologien.
      - paragraph [ref=e106]:
        - text: "I hvile kan muskelvevet utgjøre opptil 80 prosent av kroppens isolasjon: blodstrømmen til musklene begrenses, og de ligger som et lag over kjernen"
        - superscript [ref=e107]:
          - text: "["
          - link "2" [ref=e109] [cursor=pointer]:
            - /url: "#kilde-2"
          - text: "]"
        - text: . Under aktivitet øker blodgjennomstrømmingen for å levere oksygen, og varme føres fra kjernen ut til huden. Muskulaturens isolasjonsevne faller mot null ved høy intensitet
        - superscript [ref=e110]:
          - text: "["
          - link "2" [ref=e112] [cursor=pointer]:
            - /url: "#kilde-2"
          - text: "]"
        - text: ". ISO 11079 tar inn aktivitetsnivået: nødvendig isolasjon (IREQ) synker når ganghastigheten øker"
        - superscript [ref=e113]:
          - text: "["
          - link "10" [ref=e115] [cursor=pointer]:
            - /url: "#kilde-10"
          - text: "]"
        - text: .
      - paragraph [ref=e116]:
        - text: Varmeproduksjonen kan bli nesten åtte ganger så høy når du går i motbakke med vinterbekledning, sammenliknet med ro
        - superscript [ref=e117]:
          - text: "["
          - link "9" [ref=e119] [cursor=pointer]:
            - /url: "#kilde-9"
          - text: "]"
        - text: .
      - 'complementary "Tommelregel: start småkald" [ref=e120]':
        - paragraph [ref=e121]: "Tommelregel: start småkald"
        - paragraph [ref=e123]:
          - text: Du skal føle deg litt småkald når turen starter. Er du god og varm før du har begynt å gå, overopphetes du, svetter ut klærne – og fryser i første pause
          - superscript [ref=e124]:
            - text: "["
            - link "8" [ref=e126] [cursor=pointer]:
              - /url: "#kilde-8"
            - generic [ref=e127]:
              - text: ","
              - link "9" [ref=e128] [cursor=pointer]:
                - /url: "#kilde-9"
            - text: "]"
          - text: .
      - paragraph [ref=e129]:
        - text: Svette i kleslagene er ødeleggende for isolasjonen over tid, fordi vann leder varme mye raskere enn luft
        - superscript [ref=e130]:
          - text: "["
          - link "3" [ref=e132] [cursor=pointer]:
            - /url: "#kilde-3"
          - text: "]"
        - text: . Fukt i klærne kan redusere den faktiske isolasjonen med opptil 25 prosent
        - superscript [ref=e133]:
          - text: "["
          - link "9" [ref=e135] [cursor=pointer]:
            - /url: "#kilde-9"
          - text: "]"
        - text: .
      - paragraph [ref=e136]:
        - text: Energibehovet i felt kan overstige 7000 kilokalorier om dagen. Kroppen trenger drivstoff for å produsere varme, så jevnt inntak av mat og drikke teller like mye som klærne – også når du ikke kjenner sult eller tørst
        - superscript [ref=e137]:
          - text: "["
          - link "8" [ref=e139] [cursor=pointer]:
            - /url: "#kilde-8"
          - text: "]"
        - text: . I pauser faller produksjonen brått, mens fukten sitter igjen. Isolasjon – en tykk vest, et skjørt, en dunshorts – skal på med én gang du stopper
        - superscript [ref=e140]:
          - text: "["
          - link "8" [ref=e142] [cursor=pointer]:
            - /url: "#kilde-8"
          - text: "]"
        - text: .
      - heading "Hva bør man ha innerst?" [level=2] [ref=e143]
      - paragraph [ref=e144]:
        - text: Innerlagets jobb er først og fremst å transportere fukt vekk fra huden, ikke å isolere alene. Tykkelsen i et flerlags-system påvirker isolasjonen, men
        - emphasis [ref=e145]: fibermaterialet
        - text: avgjør fukthåndteringen
        - superscript [ref=e146]:
          - text: "["
          - link "3" [ref=e148] [cursor=pointer]:
            - /url: "#kilde-3"
          - text: "]"
        - text: . Hydrofile fibre (ull) og visse hydrofobe syntetiske fibre (polypropylen, polyamid) oppfører seg forskjellig; begge slår bomull. Bomull binder fukten og kollapser, og varmetapet øker når aktiviteten opphører
        - superscript [ref=e149]:
          - text: "["
          - link "3" [ref=e151] [cursor=pointer]:
            - /url: "#kilde-3"
          - text: "]"
        - text: .
      - paragraph [ref=e152]:
        - text: Bruk ull eller syntetisk innerst, og unngå bomull hvis du ikke kan skifte med én gang du blir svett
        - superscript [ref=e153]:
          - text: "["
          - link "8" [ref=e155] [cursor=pointer]:
            - /url: "#kilde-8"
          - text: "]"
        - text: . Netting isolerer fordi den fanger luft i hullene under neste lag, og ventilerer under høy aktivitet fordi den eksponerer huden
        - superscript [ref=e156]:
          - text: "["
          - link "9" [ref=e158] [cursor=pointer]:
            - /url: "#kilde-9"
          - text: "]"
        - text: .
      - paragraph [ref=e159]:
        - text: "Når ull absorberer fukt, skjer en eksoterm reaksjon: ulla frigjør varme – opptil 2,5 ganger mer enn polyamid"
        - superscript [ref=e160]:
          - text: "["
          - link "4" [ref=e162] [cursor=pointer]:
            - /url: "#kilde-4"
          - text: "]"
        - text: . En fuktig ulltrøye kan derfor fortsatt føles varm, mens en syntetisk trøye oftere føles klam når du stopper. Ull som innerlag ga i Jussilas avhandling det laveste varmekravet for fordampning, noe som reduserer etter-nedkjøling i hvile
        - superscript [ref=e163]:
          - text: "["
          - link "4" [ref=e165] [cursor=pointer]:
            - /url: "#kilde-4"
          - text: "]"
        - text: . Mer om materialvalget står i
        - link "Hva skal man ha innerst" [ref=e166] [cursor=pointer]:
          - /url: /kunnskap/hva-skal-man-ha-innerst
        - text: .
      - heading "Hva skal isolasjonslaget gjøre?" [level=2] [ref=e167]
      - paragraph [ref=e168]:
        - text: Mellomlaget skal fange stillestående luft. Luften har lav varmeledningsevne, og i et vinterantrekk står luften mellom fibrene for 80–95 prosent av isolasjonen; fibrene selv for 5–20 prosent
        - superscript [ref=e169]:
          - text: "["
          - link "4" [ref=e171] [cursor=pointer]:
            - /url: "#kilde-4"
          - text: "]"
        - text: .
      - paragraph [ref=e172]:
        - text: 3D-skanning av luftlag under flerlags vinterbekledning viser at isolasjonen ikke bare øker lineært med tykkelsen. For et tre-lags system ble maksimal effektiv isolasjon målt når luftlaget mellom plaggene rundt livet var om lag 2,2–2,4 cm. Ble gapet for stort, begynte luften å sirkulere (skorsteinseffekt), og tapet via intern konveksjon økte
        - superscript [ref=e173]:
          - text: "["
          - link "4" [ref=e175] [cursor=pointer]:
            - /url: "#kilde-4"
          - text: "]"
        - text: .
      - paragraph [ref=e176]:
        - text: Isolasjonslaget – fleece eller tykk ull – må være porøst nok til å fange luft, men ikke så tungt at det komprimerer lagene under
        - superscript [ref=e177]:
          - text: "["
          - link "2" [ref=e179] [cursor=pointer]:
            - /url: "#kilde-2"
          - text: "]"
        - text: . Klærne bør sitte litt løst. Trange plagg presser ut den isolerende luften. En tykk genser klemt flat av en for trang skalljakke mister mye av effekten
        - superscript [ref=e180]:
          - text: "["
          - link "8" [ref=e182] [cursor=pointer]:
            - /url: "#kilde-8"
          - text: "]"
        - text: .
      - heading "Hva bør man ha ytterst?" [level=2] [ref=e183]
      - paragraph [ref=e184]: Ytterlaget skal verne mikroklimaet mot vind og nedbør.
      - paragraph [ref=e185]:
        - text: "I vindstille gir en svært romslig skalljakke høy isolasjon fordi den rommer mye luft. I gangfart eller vind skaper et for stort ytterplagg pumpeeffekt: luft presses inn og ut av hals, ermer og glidelåser"
        - superscript [ref=e186]:
          - text: "["
          - link "4" [ref=e188] [cursor=pointer]:
            - /url: "#kilde-4"
          - text: "]"
        - text: . Passform og lukkede åpninger reduserer den effekten. Helt vanntett (impermeabel) bekledning stanser konveksjon, men låser fukt fra kroppen inne
        - superscript [ref=e189]:
          - text: "["
          - link "4" [ref=e191] [cursor=pointer]:
            - /url: "#kilde-4"
          - text: "]"
        - text: .
      - paragraph [ref=e192]:
        - text: Ytterlaget er et kompromiss mellom beskyttelse og ventilasjon. Membranjakker slipper ut damp, men under høy aktivitet i kulde kondenserer svetten ofte på innsiden før den rekker å dampe ut, fordi temperaturforskjellen er stor
        - superscript [ref=e193]:
          - text: "["
          - link "6" [ref=e195] [cursor=pointer]:
            - /url: "#kilde-6"
          - text: "]"
        - text: .
      - paragraph [ref=e196]:
        - text: Mekanisk lufting – glidelåser under armene og langs buksesidene – lar deg kvitte deg med overskuddsvarme uten å kle av deg
        - superscript [ref=e197]:
          - text: "["
          - link "8" [ref=e199] [cursor=pointer]:
            - /url: "#kilde-8"
          - generic [ref=e200]:
            - text: ","
            - link "9" [ref=e201] [cursor=pointer]:
              - /url: "#kilde-9"
          - text: "]"
        - text: . Ytterlaget bør være vind- og vanntett, men også la deg kaste på et forsterkningsplagg utenpå i pausene
        - superscript [ref=e202]:
          - text: "["
          - link "8" [ref=e204] [cursor=pointer]:
            - /url: "#kilde-8"
          - text: "]"
        - text: .
      - heading "Hvor mye betyr vinden?" [level=2] [ref=e205]
      - paragraph [ref=e206]: Vind endrer klærnes egenskaper, ikke bare hvordan kulden kjennes.
      - paragraph [ref=e207]:
        - text: Utenpå klær og hud ligger et grenselag av luft, typisk 4–8 mm i rolige omgivelser, som isolerer. Vind blåser laget vekk
        - superscript [ref=e208]:
          - text: "["
          - link "2" [ref=e210] [cursor=pointer]:
            - /url: "#kilde-2"
          - text: "]"
        - text: .
      - paragraph [ref=e211]:
        - text: Moderat til sterk vind (8 m/s) har redusert total klesisolasjon med opptil 33 prosent
        - superscript [ref=e212]:
          - text: "["
          - link "4" [ref=e214] [cursor=pointer]:
            - /url: "#kilde-4"
          - text: "]"
        - text: ". Tre mekanismer:"
      - list [ref=e215]:
        - listitem [ref=e216]: Grenselaget på utsiden av klærne brytes ned.
        - listitem [ref=e217]: Klærne presses flate på lo-siden, luftlagene inni komprimeres, og ledningen øker.
        - listitem [ref=e218]: Undertrykk på le-siden suger varm luft ut gjennom åpninger.
      - paragraph [ref=e219]:
        - text: Vind øker risikoen for frostskader, særlig på bar hud
        - superscript [ref=e220]:
          - text: "["
          - link "8" [ref=e222] [cursor=pointer]:
            - /url: "#kilde-8"
          - text: "]"
        - text: . Kombineres vind med bevegelse, ble den samlede reduksjonen i isolasjon omtrent 80 prosent av summen av de to effektene hver for seg
        - superscript [ref=e223]:
          - text: "["
          - link "4" [ref=e225] [cursor=pointer]:
            - /url: "#kilde-4"
          - text: "]"
        - text: . Går du raskt over en forblåst rygg, kan bekledningen miste en stor del av isolasjonen sammenliknet med stillestående i en lun dal. Ansikt, hals og glipper mellom votter, jakke, bukse og sko er kritiske.
      - heading "Hva når det regner?" [level=2] [ref=e226]
      - paragraph [ref=e227]:
        - text: Fukt rundt frysepunktet er ofte mer krevende enn tørr sprengkulde. Vann leder varme omtrent 25 ganger raskere enn luft
        - superscript [ref=e228]:
          - text: "["
          - link "3" [ref=e230] [cursor=pointer]:
            - /url: "#kilde-3"
          - generic [ref=e231]:
            - text: ","
            - link "6" [ref=e232] [cursor=pointer]:
              - /url: "#kilde-6"
          - text: "]"
        - text: .
      - paragraph [ref=e233]:
        - text: Fukt kan komme innenfra (svette) eller utenfra (regn, slaps). Når tekstilene mettes, fortrenger vannet luften i isolasjonen. Huden varmer da vann i stedet for luft, og ledningen stjeler varme raskt
        - superscript [ref=e234]:
          - text: "["
          - link "2" [ref=e236] [cursor=pointer]:
            - /url: "#kilde-2"
          - generic [ref=e237]:
            - text: ","
            - link "3" [ref=e238] [cursor=pointer]:
              - /url: "#kilde-3"
          - text: "]"
        - text: .
      - paragraph [ref=e239]:
        - text: Intern fukt (svetting) har redusert tørr isolasjon med 22–46 prosent i løpet av en halvtime og økt varmetapet med i gjennomsnitt 110 watt
        - superscript [ref=e240]:
          - text: "["
          - link "4" [ref=e242] [cursor=pointer]:
            - /url: "#kilde-4"
          - text: "]"
        - text: . Ekstern fukt reduserte isolasjonen med 0–40 prosent, avhengig av ytterstoffet – og i motsetning til svette, som kan fordampe hvis du står i ro med pustende lag, ga ytre fukt et mer langvarig fall
        - superscript [ref=e243]:
          - text: "["
          - link "4" [ref=e245] [cursor=pointer]:
            - /url: "#kilde-4"
          - text: "]"
        - text: .
      - 'complementary "Tommelregel: fukta er fienden i kulda" [ref=e246]':
        - paragraph [ref=e247]: "Tommelregel: fukta er fienden i kulda"
        - paragraph [ref=e249]:
          - text: Har du svettet ut underklærne, eller de er våte av sludd, skal de av. Et tørt ullskift i vanntett pose i sekken er den praktiske reserven
          - superscript [ref=e250]:
            - text: "["
            - link "8" [ref=e252] [cursor=pointer]:
              - /url: "#kilde-8"
            - generic [ref=e253]:
              - text: ","
              - link "9" [ref=e254] [cursor=pointer]:
                - /url: "#kilde-9"
            - text: "]"
          - text: .
      - heading "Hender og føtter" [level=2] [ref=e255]
      - paragraph [ref=e256]:
        - text: Hender og føtter har stor overflate i forhold til volumet og lite muskelmasse som kan produsere varme. For å hindre at kaldt blod fra ekstremitetene senker kjernen, struper kroppen blodårene (vasokonstriksjon). Uten varmt blod faller hudtemperaturen på fingrene raskt mot omgivelsestemperaturen
        - superscript [ref=e257]:
          - text: "["
          - link "5" [ref=e259] [cursor=pointer]:
            - /url: "#kilde-5"
          - text: "]"
        - text: .
      - paragraph [ref=e260]:
        - text: Kuldeindusert vasodilatasjon (CIVD, «hunting response») åpner deretter kortvarig spesielle årer (arteriovenøse anastomoser) i fingre og tær. En bølge av varmt blod sendes ut før årene strammes igjen. Fingerens temperatur kan stige med omtrent 10 °C i en slik fase. En varm kjerne er en forutsetning for at responsen skal inntreffe
        - superscript [ref=e261]:
          - text: "["
          - link "5" [ref=e263] [cursor=pointer]:
            - /url: "#kilde-5"
          - text: "]"
        - text: .
      - paragraph [ref=e264]:
        - text: Er hendene iskalde i starten av turen, hold tempoet oppe til kjernen er varm. Når du
        - emphasis [ref=e265]: så
        - text: stopper, har kroppen overskuddsvarme og kan sende blod ut i fingrene
        - superscript [ref=e266]:
          - text: "["
