          - text: "]"
        - text: .
      - paragraph [ref=e290]:
        - text: Frostskader oppstår når iskrystaller dannes i vannet i hud og vev. Ikke-frysende kuldeskader, som skyttergravsfot, kommer av langvarig fukt og kulde uten at vevet fryser
        - superscript [ref=e291]:
