        - heading "CloudWeave™, dun og det norske klimaet" [level=1] [ref=f2e32]
        - paragraph [ref=f2e33]: Mange tror at en tykk jakke i seg selv produserer varme. Sannheten er at det er du som er varmekilden – jakkens eneste jobb er å forhindre at denne varmen forsvinner ut i omgivelsene.
        - complementary "Forfatter og publiseringsinformasjon" [ref=f2e34]:
