        - list [ref=f2e45]:
          - listitem [ref=f2e46]: De grunnleggende fysiske prinsippene bak hvordan klær holder deg varm.
          - listitem [ref=f2e47]: Forskjellene på tradisjonelt dun og moderne syntetisk isolasjon.
          - listitem [ref=f2e48]: Hvordan fuktighet påvirker kroppens varmetap og isolasjonsmaterialets yteevne.
          - listitem [ref=f2e49]: Hvorfor det norske klimaet stiller unike krav til yttertøyet ditt.
          - listitem [ref=f2e50]: Teknologien og konstruksjonen bak CloudWeave™ og Utekos TechDown™.
      - navigation [ref=f2e51]:
