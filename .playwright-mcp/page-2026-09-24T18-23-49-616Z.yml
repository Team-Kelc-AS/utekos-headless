            - heading "Skapt for dine øyeblikk" [level=2] [ref=f1e318]
            - paragraph [ref=f1e320]: Uansett hvor du finner roen, er Utekos designet for å gjøre opplevelsen bedre.
            - list [ref=f1e322]:
              - listitem [ref=f1e323]:
                - article [ref=f1e324]:
                  - generic [ref=f1e326]:
                    - paragraph [ref=f1e328]: 01 / Ro langs veien
                    - heading "I bobilen" [level=3] [ref=f1e337]
                    - paragraph [ref=f1e340]: Lett å pakke, genial i bruk. Bytt ut store pledd og ekstra jakker med ett plagg som gjør hvert eneste stopp til en varm og komfortabel opplevelse.
              - listitem [ref=f1e341]:
                - article [ref=f1e342]:
                  - generic [ref=f1e344]:
                    - paragraph [ref=f1e346]: 02 / Kvelder på dekk
                    - heading "I båten" [level=3] [ref=f1e354]
                    - paragraph [ref=f1e357]: Nyt solnedgangen fra dekk uten å la den kalde sjøbrisen ødelegge øyeblikket. Den beskytter mot trekk og lar deg forlenge båtkvelden i ren komfort.
              - listitem [ref=f1e358]:
                - article [ref=f1e359]:
                  - generic [ref=f1e361]:
                    - paragraph [ref=f1e363]: 03 / Varmen som venter
                    - heading "På hytten" [level=3] [ref=f1e371]
                    - paragraph [ref=f1e374]: Fra iskald ankomst til umiddelbar varme. Utekos er den perfekte hytteuniformen for de kjølige kveldene på terrassen og den ferske morgenkaffen ute.
          - article [ref=f1e377]:
            - generic [ref=f1e378]:
              - generic [ref=f1e381]:
                - heading "Kvalitet i hver fiber" [level=2] [ref=f1e382]
                - paragraph [ref=f1e383]: Fra den lette spensten i dunet til slitestyrken i hver søm – vi er transparente om materialvalgene som definerer Utekos. Dette er kvalitet du kan føle på, designet for å vare.
              - generic [ref=f1e385]:
                - heading "Premium isolasjon" [level=3] [ref=f1e391]
                - paragraph [ref=f1e392]: Kun sertifisert dun og høykvalitets syntetisk fyll for optimal varme-til-vekt.
              - generic [ref=f1e394]:
                - heading "Bygget for å vare" [level=3] [ref=f1e400]
                - paragraph [ref=f1e401]: Slitesterke materialer og solide sømmer som tåler aktiv bruk i norske forhold.
