        - img "Stemningsfullt bilde av norsk natur i skumringen" [ref=f1e22]
        - generic [ref=f1e24]:
          - heading "Om Utekos" [level=1] [ref=f1e25]
          - generic [ref=f1e34]: Skreddersy varmen
          - paragraph [ref=f1e35]: Drevet av kalde kvelder og et løfte om å aldri la været stoppe de gode øyeblikkene.
      - article [ref=f1e36]:
        - generic [ref=f1e37]:
          - generic [ref=f1e38]:
            - generic [ref=f1e39]: Vår historie
            - heading "Fra idé til virkelighet" [level=2] [ref=f1e40]
            - blockquote [ref=f1e41]:
              - paragraph [ref=f1e47]: «Jeg var lei av stive pledd og gode øyeblikk som ble kuttet kort av kulden. Det måtte finnes en bedre måte å holde varmen på.»
            - generic [ref=f1e48]:
              - paragraph [ref=f1e49]: "Jeg har alltid elsket de små, verdifulle øyeblikkene: den stille kaffekoppen på en kjølig morgen, den gode samtalen rundt bålpannen, eller roen i båten rett etter at solen har gått ned. Men frustrasjonen var alltid den samme: lag på lag med klær som gjorde meg mer til en Michelin-mann enn en avslappet livsnyter."
              - paragraph [ref=f1e50]: Jeg lette etter ett enkelt, kompromissløst plagg. Et verktøy for komfort som var så behagelig at jeg glemte jeg hadde det på, men så funksjonelt at det lot meg eie øyeblikket. Svaret fantes ikke. Så jeg bestemte meg for å lage det selv.
              - paragraph [ref=f1e51]: Det ble en reise som tok måneder med design, utallige prototyper, jakt på de rette materialene, og testing i pøsende bergensregn og på kalde fjelltopper. Resultatet ble Utekos. Ikke bare et produkt, men en hyllest til de små, verdifulle øyeblikkene i en travel hverdag.
          - figure "Erling Holthe Grunnlegger" [ref=f1e53]:
            - img "Portrett av Erling Holthe, grunnlegger av Utekos" [ref=f1e55]
            - generic [ref=f1e56]:
              - generic [ref=f1e57]: Erling Holthe
              - generic [ref=f1e58]: Grunnlegger
      - article [ref=f1e59]:
        - generic [ref=f1e60]:
          - generic [ref=f1e61]:
            - generic [ref=f1e62]: Vårt DNA
            - heading "Kjernen i alt vi gjør" [level=2] [ref=f1e63]
            - paragraph [ref=f1e64]: Fire ufravikelige prinsipper som sikrer at du alltid får den opplevelsen du fortjener.
          - generic [ref=f1e65]:
            - article [ref=f1e66]:
              - heading "Designet for hygge" [level=3] [ref=f1e71]
              - paragraph [ref=f1e72]: Vi vet at en sommerkveld kan bli kjølig og en høstdag krever ekstra varme. Derfor er produktene våre designet med en dyp forståelse for den norske livsstilen og behovet for å forlenge de sosiale, gode øyeblikkene utendørs.
            - article [ref=f1e73]:
              - heading "Kompromissløs komfort" [level=3] [ref=f1e79]
              - paragraph [ref=f1e80]: Kvalitet er en følelse. Vi velger materialer som er myke, funksjonelle og behagelige, slik at du kan slappe helt av og nyte stunden.
            - article [ref=f1e81]:
              - heading "Et bevisst valg" [level=3] [ref=f1e87]
              - paragraph [ref=f1e88]: I en verden av rask mote, fokuserer vi på tidløs design og solid håndverk som tåler å bli brukt igjen og igjen. Et Utekos-plagg er et bevisst valg for deg, og et mer ansvarlig valg for naturen vi alle setter pris på.
            - article [ref=f1e89]:
              - heading "Mer utekos" [level=3] [ref=f1e97]
              - paragraph [ref=f1e98]: "Utekos handler for oss om å verdsette de rolige øyeblikkene: en kaffekopp på en kjølig morgen, en god samtale rundt bålpannen, eller en solnedgang fra terrassen."
      - article [ref=f1e99]:
        - generic [ref=f1e100]:
          - generic [ref=f1e101]: Vårt løfte
          - heading "Vårt løfte til deg" [level=2] [ref=f1e102]
          - paragraph [ref=f1e103]: Komforten skal merkes med en gang, og kvaliteten skal fortsette å bære øyeblikkene ute.
          - generic [ref=f1e104]:
            - article [ref=f1e105]:
              - heading "Mer enn et plagg" [level=3] [ref=f1e110]
              - paragraph [ref=f1e111]: Vi lover deg følelsen av umiddelbar varme og velvære. En garanti for at du kan nyte øyeblikket lenger, uten å fryse.
            - article [ref=f1e112]:
              - heading "En varig verdi" [level=3] [ref=f1e118]
              - paragraph [ref=f1e119]: Se på det som en investering i din egen livskvalitet. Kompromissløs komfort og overlegen allsidighet, designet for å gi deg flere timer utendørs, år etter år.
