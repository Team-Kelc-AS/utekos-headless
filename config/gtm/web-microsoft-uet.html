<script>
(function(w) {
  'use strict';

  var EVENT_PAGE_TYPES = {
    add_to_cart: 'cart',
    begin_checkout: 'cart',
    generate_lead: 'other',
    search: 'searchresults',
    select_item: 'product',
    view_item: 'product',
    view_item_list: 'category'
  };
  var state = w.__utekosMicrosoftUetState || { sent: {} };

  w.__utekosMicrosoftUetState = state;

  function hasMarketingConsent() {
    return Boolean(
      w.Cookiebot &&
      w.Cookiebot.consent &&
      w.Cookiebot.consent.marketing === true
    );
  }

  function finiteNumber(value) {
    return typeof value === 'number' && isFinite(value);
  }

  function isoCurrency(value) {
    if (typeof value !== 'string') return null;

    var currency = value.replace(/^\s+|\s+$/g, '').toUpperCase();
    return /^[A-Z]{3}$/.test(currency) ? currency : null;
  }

  function productId(item) {
    var candidate = item && (item.variant_id || item.item_id);
    var match;

    if (typeof candidate !== 'string') return null;

    match = /^gid:\/\/shopify\/ProductVariant\/(\d+)$/.exec(candidate);
    if (match) return match[1];

    return /^[A-Za-z0-9-]{1,50}$/.test(candidate) ? candidate : null;
  }

  function itemIds(customData) {
    var items = customData && customData.items;
    var ids = [];
    var index;

    if (!items || !items.length) return ids;

    for (index = 0; index < items.length; index += 1) {
      var id = productId(items[index]);
      if (id) ids.push(id);
    }

    return ids;
  }

  function latestCanonicalEntry() {
    var dataLayer = w.dataLayer || [];
    var index;

    for (index = dataLayer.length - 1; index >= 0; index -= 1) {
      var entry = dataLayer[index];
      var canonicalEvent = entry && entry.canonical_event;

      if (!entry || !EVENT_PAGE_TYPES[entry.event]) continue;
      if (!canonicalEvent || entry.event_id !== canonicalEvent.event_id) {
        continue;
      }
      if (canonicalEvent.event_name !== entry.event) continue;

      return entry;
    }

    return null;
  }

  function buildParameters(entry) {
    var canonicalEvent = entry.canonical_event;
    var customData = canonicalEvent.custom_data || {};
    var ids = itemIds(customData);
    var value = finiteNumber(customData.value) ?
      customData.value :
      finiteNumber(customData.gross_value) ?
        customData.gross_value :
        null;
    var currency = isoCurrency(customData.currency);
    var eventLabel =
      customData.transaction_id ||
      customData.checkout_id ||
      customData.cart_mutation_id ||
      customData.search_term ||
      canonicalEvent.event_id;
    var parameters = {
      event_category:
        ids.length ? 'ecommerce' : entry.event,
      event_id: canonicalEvent.event_id,
      event_label: eventLabel,
      ecomm_pagetype: EVENT_PAGE_TYPES[entry.event]
    };

    if (value !== null) parameters.event_value = value;

    if (value !== null && currency) {
      parameters.currency = currency;
      parameters.revenue_value = value;
      parameters.ecomm_totalvalue = value;
    }

    if (ids.length) parameters.ecomm_prodid = ids;

    return parameters;
  }

  if (!hasMarketingConsent()) return;

  var entry = latestCanonicalEntry();
  if (!entry) return;

  var eventKey = entry.event + ':' + entry.event_id;
  if (state.sent[eventKey]) return;

  w.uetq = w.uetq || [];
  if (typeof w.uetq.push !== 'function') return;

  w.uetq.push(
    'event',
    entry.event,
    buildParameters(entry)
  );
  state.sent[eventKey] = true;
})(window);
</script>
